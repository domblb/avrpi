name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Signature : secrets PIONEER_KEYSTORE_B64 (base64 du .jks), PIONEER_STORE_PASSWORD, PIONEER_KEY_PASSWORD.
    # Sans eux, l'APK est signé avec la clé de debug : téléchargeable comme artefact, mais jamais publié dans une release
    # (il ne pourrait pas mettre à jour l'appli déjà installée).
    env:
      KS_B64: ${{ secrets.PIONEER_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME) ; Gradle télécharge la plateforme manquante.

      - name: Tests
        run: node --test "test/*.test.js"

      - name: Version (public/version.js) et tag
        id: ver
        run: |
          v=$(node -p "require('./public/version.js').APP_INFO.version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then echo "::error::tag $GITHUB_REF_NAME ≠ version $v"; exit 1; fi

      - name: Interface + moteur local
        working-directory: mobile
        run: npm ci && node build-web.js && npx cap sync android

      - name: APK
        working-directory: mobile/android
        env:
          PIONEER_STORE_PASSWORD: ${{ secrets.PIONEER_STORE_PASSWORD }}
          PIONEER_KEY_PASSWORD: ${{ secrets.PIONEER_KEY_PASSWORD }}
          PIONEER_KEY_ALIAS: pioneer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export PIONEER_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Pioneer-Remote-${{ steps.ver.outputs.version }}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Pioneer-Remote-${{ steps.ver.outputs.version }}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pioneer-remote-apk
          path: dist/*.apk

      - name: Publier l'APK dans la release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.KS_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
